name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check backend and API
        run: npm run typecheck

      - name: Type-check application
        run: npm run typecheck:app

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # Deliberately excluded: npm run supabase:test:remote.
      # That command uses the linked remote Supabase project and must only run
      # against an explicitly selected Staging project.
