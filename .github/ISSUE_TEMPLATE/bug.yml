name: 缺陷报告
description: 报告可复现的网站、Community、API 或数据问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴 Token、密码、未脱敏日志或真实用户个人信息。

  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 简洁描述发生了什么。
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 环境
      options:
        - Local
        - Vercel Preview
        - Production
        - 不确定
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的截图或日志
      description: 删除 Token、邮箱、手机号、姓名和其他个人信息后再上传。

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - S1 - 生产不可用、安全或数据事件
        - S2 - 核心流程不可用且没有替代路径
        - S3 - 部分功能异常但有替代路径
        - S4 - 轻微界面或内容问题
    validations:
      required: true

  - type: checkboxes
    id: sensitive
    attributes:
      label: 安全确认
      options:
        - label: 我已经移除秘密和真实个人信息
          required: true
